name: VPNGate Scraper Auto Commit

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpngate-scraper
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Config Directory
        run: |
          rm -rf ./configs
          mkdir -p configs

      - name: Install Dependencies
        run: npm install --if-present

      - name: Run Scraper
        run: npm start

      - name: Commit and Push if Changed
        run: |
          git config user.name "bagussatoto"
          git config user.email "bagusbudisatoto2001@gmail.com"
          git add -A
          timestamp=$(date '+%F %H:%M:%S %Z')
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Update Data ${timestamp}"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected. Nothing to commit."
          fi

      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
        if: always()